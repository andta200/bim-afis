name: Bim Afis Botu

on:
  schedule:
    - cron: '0 */4 * * *'  # Her 4 saatte bir çalışır
  workflow_dispatch:

permissions:
  contents: write  # Dosyayı depoya geri kaydetmek için gerekli

jobs:
  run-scraping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run scraper script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add sent_links.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent links cache" && git push)
          
